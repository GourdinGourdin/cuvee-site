<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Outfit'; src: url('{{RACINE}}/node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Josefin'; src: url('{{RACINE}}/node_modules/@fontsource-variable/josefin-sans/files/josefin-sans-latin-wght-normal.woff2') format('woff2'); font-weight: 100 700; }
  @font-face { font-family: 'Dafoe'; src: url('{{RACINE}}/node_modules/@fontsource/mr-dafoe/files/mr-dafoe-latin-400-normal.woff2') format('woff2'); }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #f5e9e4; font-family: 'Josefin', sans-serif;
    background: radial-gradient(ellipse 60% 90% at 18% 50%, #3a2a28 0%, #2a2220 70%); }
  /* double filet doré, comme le pied de page du site */
  .cadre { position: absolute; inset: 26px; border: 1px solid rgba(168,138,74,.9); }
  .cadre::after { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(168,138,74,.45); }
  .gauche { position: absolute; left: 26px; top: 26px; bottom: 26px; width: 380px; display: grid; place-items: center; color: #f5e9e4; }
  .embleme { width: 262px; height: 419px; }
  .filet-v { position: absolute; left: 420px; top: 96px; bottom: 96px; width: 1px; background: linear-gradient(transparent, #a88a4a 20%, #a88a4a 80%, transparent); }
  .droite { position: absolute; left: 480px; top: 0; width: 650px; height: 630px; display: flex; flex-direction: column; justify-content: center; }
  .marque { font-family: 'Outfit'; font-weight: 800; font-size: 92px; letter-spacing: .32em; line-height: 1; }
  .surtitre { margin-top: 30px; font-size: 19px; font-weight: 600; letter-spacing: .34em; text-transform: uppercase; color: #e9ddbf; }
  .surtitre::before { content: ''; display: inline-block; width: 44px; height: 1px; background: #a88a4a; vertical-align: middle; margin-right: 18px; }
  h1 { margin-top: 26px; font-family: 'Outfit'; font-weight: 800; font-size: 37px; line-height: 1.32; letter-spacing: .06em; text-transform: uppercase; }
  .signature { margin-top: 34px; font-family: 'Dafoe'; font-size: 44px; line-height: 1; color: #a88a4a; transform: rotate(-3deg); transform-origin: left; }
</style>
</head>
<body>
  <div class="cadre"></div>
  <div class="gauche">{{EMBLEME}}</div>
  <div class="filet-v"></div>
  <div class="droite">
    <div class="marque">CUVÉE</div>
    <p class="surtitre">Programme pilote</p>
    <h1>Moins de bouteilles qui dorment, moins d’heures sur les commandes.</h1>
    <p class="signature">assistant de cave</p>
  </div>
</body>
</html>
